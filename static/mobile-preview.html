<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>手机端预览 - 贝利卡管家</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 18% 10%, rgba(34, 211, 238, 0.12), transparent 32%),
          radial-gradient(circle at 82% 88%, rgba(245, 188, 57, 0.1), transparent 30%),
          #070b14;
        color: #f8fafc;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      .stage {
        width: 100%;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 12px;
        padding: 18px;
      }

      .toolbar {
        width: min(393px, calc(100vw - 24px));
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #8ea0bb;
        font-size: 12px;
      }

      .toolbar strong {
        color: #ffffff;
        font-size: 14px;
      }

      .phone {
        position: relative;
        width: 393px;
        height: 852px;
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 62px);
        overflow: hidden;
        border: 10px solid #101827;
        border-radius: 38px;
        background: #080d16;
        box-shadow:
          0 24px 90px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.12),
          inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }

      .phone::before {
        content: "";
        position: absolute;
        z-index: 2;
        top: 8px;
        left: 50%;
        width: 104px;
        height: 24px;
        transform: translateX(-50%);
        border-radius: 0 0 16px 16px;
        background: #101827;
        pointer-events: none;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #080d16;
      }

      @media (max-height: 920px) {
        .phone {
          height: calc(100vh - 62px);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="toolbar">
        <strong>iPhone 15 · 393 × 852</strong>
        <span>本地可操作预览</span>
      </div>
      <section class="phone" aria-label="手机端预览">
        <iframe
		  id="mobile-app-frame"
          name="mobile-app-frame"
          src="/"
          title="贝利卡管家手机端预览"
        ></iframe>
      </section>
    </main>
	<script>
	  const requestedPath = new URLSearchParams(window.location.search).get('path');
	  if (requestedPath?.startsWith('/')) {
		document.querySelector('#mobile-app-frame').src = requestedPath;
	  }
	</script>
  </body>
</html>
